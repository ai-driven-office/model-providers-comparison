title:
  en: "Taalas HC1 Pushes Silicon Llama to ~17K tokens/sec"
  ja: "Taalas HC1がSilicon Llamaで約17Kトークン/秒を達成"

body:
  en: >-
    Taalas says its HC1 chip can run Silicon Llama 3.1 8B at about 17K tokens per second per user, which is still far
    beyond GPU-class direct inference. The design hardwires the model into custom silicon instead of relying on HBM-heavy
    accelerator stacks, and Taalas claims roughly 10x lower power than conventional hardware. The public hardware details
    remain striking: TSMC 6nm, 815mm² die size, 53B transistors, a 24-person team, and about $169M raised. The key caveat
    is quality: Taalas explicitly says the first-generation Silicon Llama is aggressively quantized with mixed 3-bit and
    6-bit weights, so it does not match full-precision GPU baselines on quality. Even with that caveat, the speed headroom
    is unusual enough to make near-zero-latency chat, instant summarization, and multi-step agent loops practical in ways
    general cloud inference still struggles to match.

  ja: >-
    Taalasは、HC1チップ上でSilicon Llama 3.1 8Bをユーザーあたり約17Kトークン/秒で動かせると公表しました。
    GPU推論と異なり、HC1はモデルを専用シリコンに焼き込み、HBM中心の構成に頼らない設計を取っています。
    公開されているハードウェア仕様もかなり攻めています。TSMC 6nm、815mm²、530億トランジスタ、24人のチーム、
    調達額は約$169Mです。ただし品質面の注意点もあり、Taalas自身が初代Silicon Llamaは3-bitと6-bitを混ぜた
    強い量子化を使っているため、フル精度のGPU実装と同等品質ではないと明記しています。それでも速度面の余裕は非常に大きく、
    体感遅延のほぼない会話AI、即時要約、高頻度なエージェントループを現実的にする水準です。

